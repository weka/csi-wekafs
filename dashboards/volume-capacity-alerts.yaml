# Alert rules for the thresholds drawn on the "Weka CSI volume capacity" dashboard
# (dashboards/volume-capacity.json). Apply to a cluster running the Prometheus Operator:
#
#   kubectl apply -n <prometheus-namespace> -f dashboards/volume-capacity-alerts.yaml
#
# For a plain Prometheus, lift the `groups:` block into your own rule file.
#
# Three things about these expressions are deliberate:
#
#   * last_over_time over 15m, not an instant selector. A reading carries the timestamp of its own
#     measurement, and the metrics server serves a quota from cache for quotaCacheValiditySeconds
#     (chart default 300s), so a volume emits roughly one sample per cache period rather than one
#     per scrape. An instant query would evaluate against gaps and the alert would flap. The window
#     must stay comfortably larger than quotaCacheValiditySeconds - raise it if you raise that.
#
#   * clamp_min on the denominator. A volume whose capacity reads zero would otherwise divide by
#     zero and evaluate to +Inf, firing every alert here at once.
#
#   * `or vector(0)` around the count in WekaCsiVolumeMetricsStale. count() of an empty vector is
#     empty, not zero, so without it the rule goes silent in exactly the case it exists to catch -
#     every volume ageing out of the window at once, which is what a total collection failure looks
#     like in batch mode, where a filesystem's volumes share one timestamp and drop together.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weka-csi-volume-capacity
  labels:
    app.kubernetes.io/name: csi-wekafsplugin
    app.kubernetes.io/component: alerts
spec:
  groups:
    - name: weka-csi-volume-capacity
      rules:
        # Recording rule so both alerts and any ad-hoc query share one definition of "utilisation",
        # and so the expensive division is evaluated once per interval rather than per alert.
        - record: weka_csi_volume:used_ratio
          expr: |
            100
              * last_over_time(weka_csi_volume_used_bytes[15m])
              / clamp_min(last_over_time(weka_csi_volume_capacity_bytes[15m]), 1)

        - alert: WekaCsiVolumeAlmostFull
          # No upper bound. Bounding this at < 95 would resolve the warning the moment the volume
          # crossed 95%, while WekaCsiVolumeFull still has 15m to wait - leaving the fullest
          # volumes with no alert firing at all. Both fire above 95% instead; suppress the warning
          # with an Alertmanager inhibit_rule on severity if the duplicate is unwanted.
          expr: weka_csi_volume:used_ratio >= 85
          # Longer than the recording rule's last_over_time window, not just longer than the quota
          # cache validity. One reading keeps the recorded series true for the whole 15m window, so
          # `for: 15m` would have been satisfiable by a single sample - which is what it exists to
          # prevent. At 20m the volume has to still be over the threshold on a later reading.
          for: 20m
          labels:
            severity: warning
          annotations:
            summary: >-
              PersistentVolume {{ $labels.pvc_namespace }}/{{ $labels.pvc_name }} is
              {{ $value | printf "%.1f" }}% full
            description: >-
              PersistentVolume {{ $labels.pv_name }} (PVC {{ $labels.pvc_namespace }}/{{
              $labels.pvc_name }}) on Weka filesystem {{ $labels.filesystem_name }}, tenant {{
              $labels.organization }}, has used {{ $value | printf "%.1f" }}% of its capacity.
              Expand the PersistentVolumeClaim or reclaim space before it fills.

        - alert: WekaCsiVolumeFull
          expr: weka_csi_volume:used_ratio >= 95
          # Same reasoning as WekaCsiVolumeAlmostFull: longer than the 15m window, so one reading
          # cannot fire it.
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: >-
              PersistentVolume {{ $labels.pvc_namespace }}/{{ $labels.pvc_name }} is critically
              full at {{ $value | printf "%.1f" }}%
            description: >-
              PersistentVolume {{ $labels.pv_name }} (PVC {{ $labels.pvc_namespace }}/{{
              $labels.pvc_name }}) on Weka filesystem {{ $labels.filesystem_name }}, tenant {{
              $labels.organization }}, has used {{ $value | printf "%.1f" }}% of its capacity.
              Writes will start failing when it reaches the quota's hard limit.

        # Neither of the next two is a capacity threshold. They are what make the two above
        # trustworthy: if the metrics server stops collecting, utilisation freezes at its last value
        # instead of going missing, and a volume can fill without either alert ever firing.
        #
        # They split the job because the comparison below cannot outlive its own right-hand side.
        # WekaCsiVolumeMetricsStale catches a partial loss - some volumes stopped reporting while
        # the server still runs - and also a total one, but only while the monitored-volumes gauge
        # is still inside its lookback. Once the server has been down longer than that the gauge is
        # gone, the comparison is empty and this rule resolves, which is why
        # WekaCsiMetricsServerNotReporting exists: it keys off the gauge being absent rather than
        # off its value, so it does not decay.
        - alert: WekaCsiVolumeMetricsStale
          expr: |
            (count(count_over_time(weka_csi_volume_used_bytes[15m])) or vector(0))
              < 0.9 * max(last_over_time(weka_csi_metricsserver_monitored_persistent_volumes_gauge[1h]))
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Weka CSI volume capacity metrics are stale
            description: >-
              Only {{ $value }} volumes reported capacity in the last 15 minutes, against the
              number the metrics server believes it is monitoring. Check the metrics server's
              weka_csi_metricsserver_fetch_* failure counters and its ability to reach the Weka
              API.

        - alert: WekaCsiMetricsServerNotReporting
          expr: absent_over_time(weka_csi_metricsserver_monitored_persistent_volumes_gauge[15m])
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: The Weka CSI metrics server is not reporting
            description: >-
              No metrics have arrived from the metrics server for 15 minutes, so every volume's
              capacity reading is frozen at its last value and the capacity alerts above cannot
              fire. Check that the metrics-server Deployment is running, that one of its replicas
              holds the leader lease, and that its PodMonitor still matches it. This alert stays
              firing for as long as collection is down; remove this rule file if the metrics server
              is being retired.
