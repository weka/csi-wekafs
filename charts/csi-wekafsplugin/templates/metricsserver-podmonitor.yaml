{{- if and .Values.metricsServer.enabled .Values.metrics.podMonitor.enabled }}
{{- if .Capabilities.APIVersions.Has "monitoring.coreos.com/v1" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Release.Name }}-metrics-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-metrics-server
    component: {{ .Release.Name }}-metrics-server
    release: {{ .Release.Name }}
    {{- with .Values.metrics.podMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-metrics-server
      component: {{ .Release.Name }}-metrics-server
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    - port: ms-metrics
      path: /metrics
      interval: {{ .Values.metricsServer.scrapeInterval | default .Values.metrics.podMonitor.interval }}
      # Metrics carry the timestamp of the measurement they describe, not of the scrape - a quota read
      # a few minutes ago is reported with that age rather than pretending to be fresh. Prometheus
      # only keeps those timestamps if told to honor them.
      honorTimestamps: true
      metricRelabelings:
        # A volume metric describes a volume, not the pod that happened to observe it. The metrics
        # server is a leader-elected Deployment, so leaving pod on forks a fresh series for every
        # volume on each rollout and each leader failover: graphs draw one line per pod a volume has
        # ever been reported by, and anything summing across pods double-counts during a handover.
        # Setting a label to the empty string removes it, and unlike labeldrop this can be
        # conditioned on the metric name - so pod survives on the metrics server's own health
        # metrics, where the pod is precisely what is being described.
        - action: replace
          sourceLabels: [__name__]
          regex: weka_csi_volume_.*
          targetLabel: pod
          replacement: ""
        - action: labeldrop
          regex: ^job$
        - action: labeldrop
          regex: ^instance$
        - action: labeldrop
          regex: ^namespace$
        - action: labeldrop
          regex: ^endpoint$
        - action: labeldrop
          regex: ^container$
{{- end }}
{{- end }}
