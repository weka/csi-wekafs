# Transform for scenario (d): a different Kubernetes cluster backed by a DIFFERENT Weka
# cluster, in another geography, holding replicated data.
#
# This is the most complete form and exercises every rule the migrator has. Preview it before
# importing anything:
#
#   export WEKA_DR_PASSWORD='...'
#   weka-csi-migrator show cluster.wcsi --transform-file transform-different-weka-cluster.yaml
#
# Every key on the left is the identity **as it appears in the archive**, never what it
# becomes. Read those identities with `weka-csi-migrator list cluster.wcsi`.

# --- where claims land -------------------------------------------------------------------
# A map when namespaces differ per team. Use `targetNamespace: dr` instead to collapse
# everything into one; the two are mutually exclusive.
#
# This deliberately does NOT move Secrets: the Weka API secret lives in the driver's
# namespace, not a workload namespace. Relocate it under `secrets:` below.
namespaces:
  default: dr-default
  team-analytics: dr-analytics

# --- where the data lives ----------------------------------------------------------------
# Replication landed the filesystem under a different name at the DR site. This rewrites the
# volume handle, the volume attribute and the StorageClass parameter together, so they cannot
# disagree about where the data is.
filesystems:
  default: default-replica

# The DR cluster installed the driver under a different name. Applied to every PV's
# spec.csi.driver and every StorageClass's provisioner.
driverName: weka-infra.weka.io

# --- object names ------------------------------------------------------------------------
# Rename to avoid collisions with objects the DR cluster already has.
storageClasses:
  storageclass-wekafs-dir-api: storageclass-wekafs-dir-dr
  storageclass-wekafs-fs-api: storageclass-wekafs-fs-dr

persistentVolumes:
  pvc-11111111-1111-1111-1111-111111111111: pv-analytics-scratch-dr

# Keyed "<source-namespace>/<name>"; the value is a bare name. Namespaces move via
# `namespaces:` above, not here.
persistentVolumeClaims:
  team-analytics/pvc-wekafs-dir-api: pvc-analytics-scratch

# --- how the DR site is reached ------------------------------------------------------------
# A different Weka cluster means a different endpoint, a different organization and different
# credentials. Values are plaintext and are base64-encoded for you.
#
# ${VAR} reads an environment variable, which is how the password stays out of this file and
# out of version control. An unset variable is a hard error, never an empty password.
secrets:
  csi-wekafs/csi-wekafs-api-secret:
    name: weka-dr-api-secret
    namespace: weka-dr
    data:
      endpoints: 10.200.0.11:14000,10.200.0.12:14000
      organization: DisasterRecovery
      username: dr-csi
      password: ${WEKA_DR_PASSWORD}
      scheme: https
    # The DR site sets NFS group IPs on the cluster itself, so this key is not needed.
    removeData:
      - nfsTargetIps

# --- how volumes are mounted and scheduled --------------------------------------------------
# A scalar applies to every volume. A list works too, and a mapping of PV name to either form
# lets one volume differ:
#
#   mountOptions:
#     pvc-11111111-1111-1111-1111-111111111111: [ro]
#
# An explicit `mountOptions: []` clears the options instead.
mountOptions: ro,noatime

# Replaced wholesale rather than edited: the DR cluster publishes a different topology key,
# so changing only the values would preserve the wrong constraint.
nodeAffinity:
  key: topology.weka-infra.weka.io/accessible
  values: ["true"]
# Use this instead to drop the constraint entirely:
# nodeAffinity:
#   remove: true

# --- bookkeeping ----------------------------------------------------------------------------
metadata:
  # Optional. Without it the edits apply to every object in the archive.
  kinds:
    - PersistentVolume
    - PersistentVolumeClaim
  annotations:
    set:
      migrated-from: prod-eu-west
      migrated-by: weka-csi-migrator
    remove:
      - internal.example.com/scratch-only
    rename:
      old.example.com/owner: platform.example.com/owner
  labels:
    set:
      site: dr
