apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-wekafs-fssnap-static-api
spec:
  storageClassName: storageclass-wekafs-fssnap-static-api
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  capacity:
    storage: 1Gi
  csi:
    driver: csi.weka.io
    # volumeHandle must be formatted as following:
    # weka/v2/<FILE_SYSTEM_NAME>:<SNAPSHOT_ACCESS_POINT>[/innerPath]
    # Snapshot name must be csivol-<SNAPSHOT_ACCESS_POINT>
    # The path must exist, otherwise publish request will fail
    volumeHandle: weka/v2/testfs:testfs-2
    nodePublishSecretRef:
      name: csi-wekafs-api-secret
      namespace: csi-wekafs
    controllerExpandSecretRef:
      name: csi-wekafs-api-secret
      namespace: csi-wekafs
  # Make the PV schedulable only on nodes carrying the WEKA CSI Plugin's node label.
  # The key embeds the driver name, so it is topology.<csiDriverName>/accessible - adjust it
  # if the plugin was installed with a csiDriverName other than the default csi.weka.io.
  # The plugin only sets this label while pluginConfig.manageNodeTopologyLabels is true; where
  # it is false (Operator-managed clusters), match topology.csi.weka.io/global instead.
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.csi.weka.io/accessible
              operator: In
              values:
                - "true"
