name: release-v3

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v3
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Releases can only be cut from main, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.PAT }} # https://github.com/stefanzweifel/git-auto-commit-action#push-to-protected-branches
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Git Version
        id: auto_version
        uses: codacy/git-version@2.8.7
        with:
          prefix: v
          release-branch: main # default is master; any other branch gets a -<branch>.N.sha.X suffix
          minor-identifier: /feat(ure)*:/
          major-identifier: /breaking:/

      # The only place the version is computed; every later step reads these outputs.
      - name: Set version
        id: version
        env:
          VERSION: ${{ steps.auto_version.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION', expected vX.Y.Z" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "previous_tag=$(git describe --tags --abbrev=0 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREV: ${{ steps.version.outputs.previous_tag }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$VERSION" -f target_commitish=main -f previous_tag_name="$PREV" \
            --jq .body > "$RUNNER_TEMP/notes.md"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Go binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Building Go binaries for version: $VERSION"
          go mod download
          export CGO_ENABLED=0 GOOS=linux
          for GOARCH in amd64 arm64; do
            export GOARCH
            mkdir -p "build/$GOOS-$GOARCH"
            echo "Building for GOOS=$GOOS GOARCH=$GOARCH"
            go build -ldflags "-X main.version=$VERSION" -o "build/$GOOS-$GOARCH" ./cmd/...
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          registry: quay.io

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile-gha
          push: true
          pull: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY_NAME }}/csi-wekafs:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_REGISTRY_NAME }}/csi-wekafs:latest
          cache-from: |
            type=gha,key=wekacsiplugin-amd64
            type=gha,key=wekacsiplugin-arm64
          cache-to: |
            type=gha,mode=max,key=wekacsiplugin-amd64
            type=gha,mode=max,key=wekacsiplugin-arm64
          labels: |
            revision=${{ steps.version.outputs.version }}
            version=${{ steps.version.outputs.version }}
            release=${{ steps.version.outputs.version }}
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.21.3

      - name: Install Helm schema-gen plugin
        run: helm plugin install https://github.com/karuppiah7890/helm-schema-gen.git

      - name: Stamp chart, docs and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: hack/release-stamp.sh "$VERSION" "$RUNNER_TEMP/notes.md"

      # https://github.com/stefanzweifel/git-auto-commit-action#push-to-protected-branches
      - name: Commit release files
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          # draft-v2 skips commits starting with "Release v", so keep this format
          commit_message: Release ${{ steps.version.outputs.version }}
          file_pattern: README.md RELEASE.md charts/

      # https://colinwilson.uk/2022/01/27/how-to-sign-helm-charts-using-chart-releaser-action/
      - name: Prepare GPG key
        env:
          GPG_KEYRING_BASE64: "${{ secrets.GPG_KEYRING_BASE64 }}"
          GPG_PASSPHRASE: "${{ secrets.GPG_PASSPHRASE }}"
        run: |
          gpg_dir=.cr-gpg
          mkdir "$gpg_dir"
          keyring="$gpg_dir/secring.gpg"
          base64 -d <<< "$GPG_KEYRING_BASE64" > "$keyring"
          passphrase_file="$gpg_dir/passphrase"
          echo "$GPG_PASSPHRASE" > "$passphrase_file"
          echo "CR_PASSPHRASE_FILE=$passphrase_file" >> "$GITHUB_ENV"
          echo "CR_KEYRING=$keyring" >> "$GITHUB_ENV"

      - uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.BOTTY_GH_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "v{{ .Version }}"
          CR_GENERATE_RELEASE_NOTES: false
          CR_MAKE_RELEASE_LATEST: true
          CR_RELEASE_NOTES_FILE: CHANGELOG.md
          CR_SIGN: true
          CR_KEY: "WEKA CSI"
          CR_SKIP_EXISTING: true

      - name: Remove GPG key
        if: always()
        run: rm -rf .cr-gpg
