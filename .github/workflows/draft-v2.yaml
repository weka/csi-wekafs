name: draft-v2

on:
  push:
    # main only. Development lands on dev continuously, and a draft release per merge there is
    # noise - a draft is wanted when dev is merged into main, which is what a release is cut from.
    # Drafting for any other branch is still possible on demand through workflow_dispatch.
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to create release from'
        required: true
        type: string
        default: main
      release_version:
        description: 'Version for the release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  generate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }} # checkout the correct branch name
          fetch-depth: 0                # fetch the whole repo history

      - name: Git Version
        id: auto_version
        uses: codacy/git-version@2.8.7
        with:
          prefix: v
          minor-identifier: /feat(ure)*:/
          major-identifier: /breaking:/

      - name: Set package version
        id: version
        run: |
          INPUT_VERSION="${{ inputs.release_version }}"
          if [[ $INPUT_VERSION ]]; then
            version="v$(echo "$INPUT_VERSION" | sed 's/^v//') # remove 'v' prefix if present)"
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.auto_version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set Target Branch
        id: target_branch
        run: |
          TARGET_BRANCH="${{ inputs.target_branch }}"
          if [[ -z "$TARGET_BRANCH" ]]; then
            # Only reachable on `push`, where the branch that triggered the run is the branch
            # to draft. A hardcoded fallback drafts the wrong branch's notes for every other
            # trigger branch.
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Fetch merged PRs into target branch
        run: |
          # Bound the notes by the previous release. Without `merged:>`, `gh pr list` returns
          # the most recently merged PRs regardless of which release shipped them, so a draft
          # repeats work that already went out. `--limit` has to be generous for the same
          # reason: the default page of 30 is a count, not a boundary, and silently drops the
          # oldest PRs of the cycle once more than that have merged.
          #
          # The boundary is the newest tag *reachable from the branch being released*, not the
          # newest release by wall-clock, so a release cut from a side branch cannot pull the
          # boundary forward and hide PRs that belong in this one.
          TARGET="${{ steps.target_branch.outputs.target_branch }}"
          REF="origin/$TARGET"
          git rev-parse --verify -q "$REF" >/dev/null || REF=HEAD
          TAG=$(git describe --tags --abbrev=0 "$REF" 2>/dev/null || true)
          WINDOW=""
          if [[ -n "$TAG" ]]; then
            SINCE=$(git log -1 --format=%cI "$TAG")
            WINDOW="merged:>$SINCE"
            echo "listing PRs merged after $TAG ($SINCE), the newest tag on $REF"
          else
            echo "no tag reachable from $REF - listing every merged PR"
          fi

          # Search the integration branch as well as the release branch. Development lands on dev
          # and reaches main as a single dev -> main pull request, so searching only the release
          # branch would find that one merge and none of the work inside it - a release note listing
          # "merge dev into main" and nothing else. Searching the merge timestamp rather than commits
          # is what makes this survive rebase-and-merge, which rewrites the SHAs on the way.
          BASES="$TARGET"
          [[ "$TARGET" != "dev" ]] && BASES="$BASES dev"
          : > prs.raw.json
          for BASE in $BASES; do
            echo "  searching base:$BASE"
            gh pr list --limit 500 --search "base:$BASE is:merged $WINDOW" \
              --json number,title,body,labels,author,url,headRefName >> prs.raw.json
          done

          # Drop the dev -> main pull request itself: it carries no change of its own, and listing it
          # beside the work it delivered reads as a duplicate. Then de-duplicate, since a PR can be
          # found under both bases.
          jq -s 'add | map(select(.headRefName != "dev")) | unique_by(.number)' prs.raw.json > prs.json
          rm -f prs.raw.json
          echo "fetched $(jq length prs.json) PRs"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes and skipped PRs
        run: |
          cat <<'EOF' > generate-notes.mjs
          import fs from 'fs';

          const prs = JSON.parse(fs.readFileSync('prs.json'));

          const sections = {
            '### New Features': [],
            '### Improvements': [],
            '### Bug Fixes': [],
            '### Documentation': [],
            '### Miscellaneous': []
          };

          const details = [];
          const skipped = [];
          const artifactHubNotes = [];

          function getSection(pr) {
            const labels = pr.labels.map(l => l.name.toLowerCase());
            const title = pr.title.toLowerCase();

            if (labels.includes('feature')) return '### New Features';
            if (labels.includes('enhancement')) return '### Improvements';
            if (labels.includes('fix') || labels.includes('bug')) return '### Bug Fixes';
            if (labels.includes('documentation')) return '### Documentation';
            if (labels.includes('tests') || labels.includes('dependencies') || labels.includes('ci')) return '### Miscellaneous';
            return '';
          }
          
          function getArtifactHubKind(pr){
            const labels = pr.labels.map(l => l.name.toLowerCase());
            const title = pr.title.toLowerCase();
            if (!title.includes('(csi-')) {
              return '';
            };
            if (labels.includes('feature')) {
              return 'added';
            };
            if (labels.includes('enhancement')) {
              return 'changed';
            }; 
            if (labels.includes('fix') || labels.includes('bug')) {
              return 'fixed';
            };
            return '';
          }

          function isSkippable(pr) {
            return !pr.title || pr.title.trim() === '' || pr.title.startsWith('Merge') || pr.title.startsWith('Draft') || getSection(pr) === '' || pr.author?.is_bot;
          }

          const rnLines = [];
          rnLines.push('## What\'s Changed\n');
        
          for (const pr of prs) {
            if (isSkippable(pr)) {
              skipped.push(pr);
              continue;
            }
            
            const section = getSection(pr);
            const author = pr.author?.login || 'unknown';
            const entry = `* ${pr.title} by @${author} in ${pr.url} [(more details)](#pr-${pr.number})`;
            sections[section].push(entry);
          
            const artifactHubKind = getArtifactHubKind(pr);
            if (artifactHubKind) {
              const change = {
                kind: artifactHubKind,
                description: pr.title,
                links: [
                  { name: `PR #${pr.number}`, url: pr.url }
                ]
              };
              artifactHubNotes.push(change);
            }

            const bodyLines = (pr.body || '_No description provided._')
              .trim()
              .split('\n')
              .map(line => '> ' + line.trim());

            const detailBlock = [
              `### <a name="pr-${pr.number}"></a>PR #${pr.number} - ${pr.title}`,
              `by @${author} in ${pr.url}`,
              '',
              ...bodyLines,
              ''
            ].join('\n');

            details.push(detailBlock);
          }

          for (const [section, items] of Object.entries(sections)) {
            if (items.length > 0) {
              rnLines.push(section);
              rnLines.push(...items);
              rnLines.push('');
            }
          }

          rnLines.push('---\n## PR Details\n');
          rnLines.push(...details);
          fs.writeFileSync('RELEASE_NOTES.md', rnLines.join('\n'));

          // Write skipped PRs
          const skippedLines = ['# Skipped PRs', ''];
          for (const pr of skipped) {
            skippedLines.push(`- PR #${pr.number}: ${pr.title || '_No title_'} by @${pr.author?.login || 'unknown'} in ${pr.url}`);
          }
          fs.writeFileSync('SKIPPED_PRS.md', skippedLines.join('\n'));
          fs.writeFileSync('artifacthub_changes.json', JSON.stringify(artifactHubNotes, null, 2));
          EOF

          node generate-notes.mjs

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

      - name: Upload skipped PRs artifact
        uses: actions/upload-artifact@v7
        with:
          name: skipped-prs
          path: SKIPPED_PRS.md

      - name: Create draft GitHub Release
        id: create_draft
        run: |
          TAG="v$(date +%Y%m%d%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" \
            --target ${{ steps.target_branch.outputs.target_branch }} \
            --title "${{ steps.version.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            --draft && \
          release_url=$(gh release view "$TAG" --json url | jq -r .url) && \
          echo "release_url=$release_url" >> "$GITHUB_OUTPUT"
          echo "draft_tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ArtifactHub changes to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ steps.create_draft.outputs.draft_tag }}
          FILE_PATH="artifacthub_changes.json"
          # Upload the asset to the release
          gh release upload "$TAG_NAME" "$FILE_PATH" --repo="${{ github.repository }}" --clobber

      - name: Read Markdown file
        id: read_md
        run: |
          content="$(head -10 RELEASE_NOTES.md)"
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "**[View Full Release Notes](${{ steps.create_draft.outputs.release_url }})**" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: List workspace contents
        run: ls -lah /home/runner/work/csi-wekafs/csi-wekafs

      - uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: "yellow"
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_USERNAME: csiBot
          SLACK_ICON_EMOJI: ":robot_face:"
          SLACK_TITLE: ":scroll: DRAFT RN: ${{ steps.version.outputs.version }}"
          SLACKIFY_MARKDOWN: "true"
          SLACK_MESSAGE: "${{ steps.read_md.outputs.content }}'"
          SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C056KDJHMRP
          SLACK_FOOTER: ""
          MSG_MINIMAL: true
